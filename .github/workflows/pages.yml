# Publishes public/ as the GitHub Pages site.
# GitHub Pages can only build the repo root or /docs from a branch, and the
# pages live in public/, so a branch build 404s on every URL. This workflow
# uploads public/ as the site root and does not run Jekyll.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Branch deploys read CNAME from the repo root. Actions deploys read it
      # from the uploaded site, so the same file has to be in the artifact.
      - name: Include the custom domain
        run: cp CNAME public/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
