# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/casual-david
#          sudo ln -s /etc/nginx/sites-available/casual-david /etc/nginx/sites-enabled/
#          sudo certbot --nginx -d casualdavid.com.ng -d www.casualdavid.com.ng
#          sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name casualdavid.com.ng www.casualdavid.com.ng;

    # Mod uploads can be large (matches MAX_MOD_FILE_MB, plus a little headroom).
    client_max_body_size 250m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
