<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=localStorage.getItem("cd_theme")||"system";if(t==="system")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mod • Casual_DAViD</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    .product-page { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
    .back-link { display: inline-flex; align-items: center; gap: 0.4rem; color: #2563eb; text-decoration: none; font-weight: 500; margin-bottom: 1rem; }
    .product-layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 2rem; }
    .gallery { background: rgba(255,255,255,0.7); backdrop-filter: blur(16px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.8); padding: 1.25rem; position: relative; }
    [data-theme="dark"] .gallery { background: rgba(30,41,59,0.8); border-color: rgba(255,255,255,0.1); }
    .gallery-main { width: 100%; aspect-ratio: 1; background: #f1f5f9; border-radius: 14px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 0.75rem; position: relative; cursor: zoom-in; }
    [data-theme="dark"] .gallery-main { background: #0f172a; }
    .gallery-main img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .gallery-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.85); border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; z-index: 2; }
    .gallery-nav.prev { left: 0.5rem; }
    .gallery-nav.next { right: 0.5rem; }
    .gallery-thumbs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .gallery-thumbs img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
    .gallery-thumbs img.active { border-color: #2563eb; }
    .donate-btn { display: inline-flex; align-items: center; gap: 0.4rem; background: #ff5e5b; color: white; padding: 0.55rem 1rem; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 0.9rem; margin-top: 0.5rem; }
    .donate-btn:hover { background: #e54d4a; }
    .product-info { background: rgba(255,255,255,0.7); backdrop-filter: blur(16px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.8); padding: 1.5rem; }
    [data-theme="dark"] .product-info { background: rgba(30,41,59,0.8); border-color: rgba(255,255,255,0.1); color: #e2e8f0; }
    .info-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
    .info-icon { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; background: #f1f5f9; }
    [data-theme="dark"] .info-icon { background: #0f172a; }
    .product-info h1 { font-family: var(--heading); font-size: 1.75rem; margin: 0; }
    .subcats { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.4rem 0 0.75rem; }
    .subcat { background: #e0e7ff; color: #3730a3; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    html[data-theme="dark"] .subcat, [data-theme="dark"] .subcat { background: #312e81 !important; color: #c7d2fe !important; }
    .product-price { font-size: 2rem; font-weight: 700; color: var(--primary); margin: 1rem 0; }
    .delivery { display: flex; justify-content: space-between; padding: 0.75rem 0; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; margin: 1rem 0; font-size: 0.95rem; }
    [data-theme="dark"] .delivery { border-color: #334155; }
    .buy-now { width: 100%; padding: 0.9rem; background: #2563eb; color: white; border: none; border-radius: 12px; font-weight: 600; font-size: 1.05rem; cursor: pointer; margin-top: 0.5rem; text-decoration: none; display: inline-block; text-align: center; }
    .buy-now:hover { background: #1d4ed8; }
    .desc { margin-top: 1.5rem; color: #475569; line-height: 1.6; }
    [data-theme="dark"] .desc { color: #cbd5e1; }
    .desc a { color: #2563eb; text-decoration: underline; }
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; display: none; align-items: center; justify-content: center; }
    .lightbox.open { display: flex; }
    .lightbox-inner { position: relative; max-width: 90vw; max-height: 85vh; }
    .lightbox-inner img { max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: 12px; }
    .lb-close { position: absolute; top: -40px; right: 0; background: white; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; }
    .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; background: white; border: none; cursor: pointer; font-size: 1.2rem; }
    .lb-nav.prev { left: -50px; }
    .lb-nav.next { right: -50px; }
    @media (max-width: 768px) { .product-layout { grid-template-columns: 1fr; } .lb-nav.prev { left: 10px; } .lb-nav.next { right: 10px; } }
  </style>
</head>
<body>
  <header class="header"><div class="header-inner">
      <a href="index.html" class="logo">
        <img src="avatar.png" alt="Casual_DAViD" class="logo-img">
        <div class="logo-text">
          <span class="name">Casual_DAViD</span>
          <span class="tag">Quality of Life Mods & Plugins</span>
        </div>
      </a>
      <nav class="nav-pill">
        <a href="content.html">Content</a>
        <a href="mods.html" class="active">Mods</a>
        <a href="about.html">About</a>
      </nav>
      <button class="hamburger" onclick="toggleMenu()" aria-label="Menu" style="background:none;border:none;cursor:pointer;padding:0.4rem;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="6" width="18" height="2" rx="1"/><rect x="3" y="11" width="18" height="2" rx="1"/><rect x="3" y="16" width="18" height="2" rx="1"/></svg>
  </button>
      <div class="header-right" style="display:flex; align-items:center; gap:0.5rem;">
        <button id="theme-btn" onclick="cycleTheme()" style="background:none; border:1px solid #e2e8f0; border-radius:999px; padding:0.35rem 0.7rem; cursor:pointer; font-size:0.85rem;">🌙</button>
        <button id="account-btn" onclick="openLogin()" style="background:none;border:1px solid #e2e8f0;border-radius:999px;padding:0.35rem 0.7rem;cursor:pointer;font-size:0.85rem;">Sign in</button>
        <a href="mods.html" class="btn-sm">Shop</a>
      </div>
    </div>
  </header>
  <div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>
  <div class="mobile-menu" id="mobile-menu">
    <a href="content.html">Content</a>
    <a href="mods.html">Mods</a>
    <a href="about.html">About</a>
    <a href="mods.html">Shop</a>
  </div>

  <div class="product-page">
    <a href="mods.html" class="back-link" style="display:inline-flex; align-items:center; gap:0.4rem; color:#2563eb; text-decoration:none; font-weight:600; font-size:1rem; margin-bottom:1rem; padding:0.4rem 0;">← Back to mods</a>
    <div id="product-content">Loading…</div>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-inner">
      <button class="lb-close" onclick="closeLightbox()">✕</button>
      <button class="lb-nav prev" onclick="lbPrev()">←</button>
      <img id="lb-img" src="" alt="">
      <button class="lb-nav next" onclick="lbNext()">→</button>
    </div>
  </div>

  <footer class="footer">
    <div class="container footer-inner">
      <p>© 2026 Casual_DAViD </p>
      <p>NOT AFFILIATED WITH MOJANG OR MICROSOFT</p>
    </div>
  </footer>

  <script type="module" src="firebase-auth.js"></script>
  <script type="module" src="firebase-mods.js"></script>
  <script src="api.js"></script>
  <script type="module">
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const params = new URLSearchParams(location.search);
    let images = [];
    let currentIndex = 0;

    function renderDescription(md) {
      if (!md) return '';
      let html = md
        .replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/\n/g, '<br>');
      html = html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
      return html;
    }

    function getSubcats(mod) {
      if (Array.isArray(mod.subcategories) && mod.subcategories.length) return mod.subcategories;
      if (mod.subcategory) return [mod.subcategory];
      if (mod.mainCategory) return [mod.mainCategory];
      return [];
    }

    async function checkOwned(modId) {
      if (!window.firebaseAuth || !window.firebaseAuth.auth) return false;
      const user = window.firebaseAuth.auth.currentUser;
      if (!user) return false;
      try {
        const db = getFirestore();
        const snap = await getDoc(doc(db, 'purchases', user.uid + '_' + modId));
        return snap.exists();
      } catch (e) { return false; }
    }

    async function getDonateLink() {
      try {
        const modsApi = window.firebaseMods;
        if (modsApi && modsApi.getSocials) {
          const s = await modsApi.getSocials();
          return s.donate || '';
        }
      } catch (e) {}
      return '';
    }

    async function loadProduct() {
      const box = document.getElementById('product-content');
      const id = params.get('id');
      if (!id) {
        box.innerHTML = '<p>Mod not found.</p>';
        return;
      }
      let mod;
      try {
        if (!window.firebaseMods) await new Promise(r => setTimeout(r, 400));
        mod = await window.firebaseMods.get(id);
      } catch (err) {
        box.innerHTML = '<p>' + escapeHtml(err.message) + '</p>';
        return;
      }
      if (!mod) {
        box.innerHTML = '<p>Mod not found.</p>';
        return;
      }
      const currency = getCurrency();
      const versions = mod.versions || [];
      const price = versions.length ? versions[0].price : (mod.price || 0);
      const hasFile = (versions.length && versions[0].fileUrl) || mod.fileUrl;
      const owned = await checkOwned(mod.id);
      const fileUrl = mod.fileUrl || (versions[0] && versions[0].fileUrl);
      const fileName = mod.fileName || (versions[0] && versions[0].fileName) || 'download';
      const screenshots = (mod.screenshots || []).filter(Boolean);
      images = screenshots.length ? screenshots : (mod.icon ? [mod.icon] : []);
      const subcats = getSubcats(mod);
      const donate = mod.donateUrl || await getDonateLink();
      document.title = mod.name + ' • Casual_DAViD';
      box.innerHTML = `
        <div class="product-layout">
          <div class="gallery">
            <div class="gallery-main" id="main-img" onclick="openLightbox(currentIndex)">
              ${images[0] ? `<img src="${escapeHtml(images[0])}" alt="">` : '<span style="font-size:3rem;">📦</span>'}
              ${images.length > 1 ? `<button class="gallery-nav prev" onclick="event.stopPropagation(); prevImg()">←</button>
              <button class="gallery-nav next" onclick="event.stopPropagation(); nextImg()">→</button>` : ''}
            </div>
            <div class="gallery-thumbs" id="thumbs">
              ${images.map((src, i) => `<img src="${escapeHtml(src)}" class="${i===0?'active':''}" onclick="goTo(${i})" alt="">`).join('')}
            </div>
            ${donate ? `<a class="donate-btn" href="${escapeHtml(donate)}" target="_blank" rel="noopener">☕ Donate</a>` : ''}
          </div>
          <div class="product-info">
            <div class="info-header">
              ${mod.icon ? `<img class="info-icon" src="${escapeHtml(mod.icon)}" alt="">` : ''}
              <div>
                <h1>${escapeHtml(mod.name)}</h1>
                <div class="subcats">${subcats.map(s => `<span class="subcat">${escapeHtml(s)}</span>`).join('')}</div>
              </div>
            </div>
            <div class="product-price">${owned ? 'Owned' : formatPrice(price, currency)}</div>
            <div class="delivery"><span>Delivery time</span><strong>Instant</strong></div>
            ${hasFile
              ? (owned
                  ? `<a class="buy-now" href="${escapeHtml(fileUrl)}" download="${escapeHtml(fileName)}">Download</a>`
                  : `<button class="buy-now" id="buy-now">Buy now</button>`)
              : `<button class="buy-now" disabled style="opacity:0.6;cursor:not-allowed;">Coming soon</button>`}
            <div class="desc">
              <h3 style="margin-bottom:0.5rem;">Description</h3>
              <div>${renderDescription(mod.description || mod.summary || '')}</div>
            </div>
          </div>
        </div>
      `;
      const buy = document.getElementById('buy-now');
      if (buy) buy.addEventListener('click', () => { location.href = 'checkout.html?id=' + encodeURIComponent(mod.id); });
    }

    function updateGallery() {
      const main = document.getElementById('main-img');
      const img = main && main.querySelector('img');
      if (images[currentIndex] && img) img.src = images[currentIndex];
      document.querySelectorAll('#thumbs img').forEach((el, i) => {
        el.classList.toggle('active', i === currentIndex);
      });
    }

    window.goTo = (i) => { currentIndex = i; updateGallery(); };
    window.nextImg = () => { currentIndex = (currentIndex + 1) % images.length; updateGallery(); };
    window.prevImg = () => { currentIndex = (currentIndex - 1 + images.length) % images.length; updateGallery(); };

    window.openLightbox = (i) => {
      if (!images[i]) return;
      currentIndex = i;
      document.getElementById('lb-img').src = images[currentIndex];
      document.getElementById('lightbox').classList.add('open');
    };
    window.closeLightbox = () => { document.getElementById('lightbox').classList.remove('open'); };
    window.lbNext = () => { currentIndex = (currentIndex + 1) % images.length; document.getElementById('lb-img').src = images[currentIndex]; updateGallery(); };
    window.lbPrev = () => { currentIndex = (currentIndex - 1 + images.length) % images.length; document.getElementById('lb-img').src = images[currentIndex]; updateGallery(); };

    loadProduct();
  </script>
<script src="theme.js"></script>
<script src="account.js"></script>
</body>
</html>
