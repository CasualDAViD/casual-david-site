<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=localStorage.getItem("cd_theme")||"system";if(t==="system")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin • Casual_DAViD</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    .admin-wrap { max-width: 820px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: white; border-radius: 16px; border: 1px solid #e2e8f0; padding: 1.5rem; margin-bottom: 1.25rem; box-shadow: 0 4px 20px rgb(0 0 0 / 0.04); }
    [data-theme="dark"] .card { background: #1e293b; border-color: #334155; color: #e2e8f0; }
    .card h2 { margin-bottom: 1rem; font-size: 1.35rem; }
    .btn { background: #2563eb; color: white; border: none; padding: 0.7rem 1.2rem; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 0.75rem; }
    .btn:hover { background: #1d4ed8; }
    .btn-danger { background: #dc2626; }
    .btn-plain { background: #f1f5f9; color: #0f172a; }
    [data-theme="dark"] .btn-plain { background: #334155; color: #f1f5f9; }
    .mod-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .mod-item { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 10px; flex-wrap: wrap; }
    [data-theme="dark"] .mod-item { border-color: #334155; }
    .preview-img { width: 48px; height: 48px; object-fit: contain; border-radius: 6px; background: #f1f5f9; }
    .muted { color: #64748b; font-size: 0.85rem; }
    .success { color: #16a34a; font-size: 0.9rem; margin-top: 0.5rem; }
    .error { color: #dc2626; font-size: 0.9rem; margin-top: 0.5rem; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .tabs button { background: #f1f5f9; border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 500; }
    [data-theme="dark"] .tabs button { background: #334155; color: #e2e8f0; }
    .tabs button.active { background: #2563eb; color: white; }
    .hidden { display: none; }
    label { display: block; font-weight: 600; margin: 0.9rem 0 0.3rem; }
    input, textarea, select { width: 100%; padding: 0.65rem 0.85rem; border-radius: 8px; border: 1px solid #cbd5e1; background: white; box-sizing: border-box; font-family: inherit; }
    [data-theme="dark"] input, [data-theme="dark"] textarea, [data-theme="dark"] select { background: #0f172a; color: #f1f5f9; border-color: #475569; }
    textarea { min-height: 100px; resize: vertical; }
    .sub-grid { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin-top: 0.3rem; }
    .sub-grid label { font-weight: 500; margin: 0; display: flex; align-items: center; gap: 0.35rem; cursor: pointer; }
    .admin-gate { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 1.25rem; overflow: auto; background: var(--bg); color: var(--text); }
    .admin-gate.hidden { display: none; }
    .admin-login-stack { width: min(100%, 400px); display: flex; flex-direction: column; align-items: center; }
    .admin-login-logo { width: 88px; height: auto; display: block; }
    .admin-login-title { margin: 0.7rem 0 1.1rem; font-family: var(--heading); font-size: 1.8rem; font-weight: 700; }
    .admin-login-card { width: 100%; padding: 2rem; background: rgba(255,255,255,0.92); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.6); border-radius: 20px; box-shadow: 0 12px 40px rgb(0 0 0 / 0.1); }
    [data-theme="dark"] .admin-login-card { background: rgba(30,41,59,0.9); border-color: rgba(255,255,255,0.1); }
    .oauth-btn { display: flex; align-items: center; justify-content: center; gap: 0.75rem; width: 100%; padding: 0.75rem 1rem; border-radius: 12px; border: 1px solid var(--border); background: white; cursor: pointer; font-weight: 500; margin-bottom: 0.75rem; }
    [data-theme="dark"] .oauth-btn { background: #1e293b; }

    /* Markdown editor */
    .md-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 0.3rem; }
    .md-pane { border: 1px solid #cbd5e1; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-height: 220px; }
    [data-theme="dark"] .md-pane { border-color: #475569; }
    .md-toolbar { display: flex; gap: 0.2rem; padding: 0.35rem; border-bottom: 1px solid #e2e8f0; background: #f8fafc; }
    [data-theme="dark"] .md-toolbar { background: #1e293b; border-color: #334155; }
    .md-toolbar button { background: none; border: 0; min-width: 32px; height: 32px; border-radius: 6px; cursor: pointer; font-weight: 700; }
    .md-toolbar button:hover { background: #e2e8f0; }
    [data-theme="dark"] .md-toolbar button:hover { background: #334155; }
    #mod-desc { flex: 1; border: 0; border-radius: 0; resize: none; min-height: 180px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9rem; }
    .md-preview { padding: 0.8rem 1rem; overflow-y: auto; flex: 1; font-size: 0.92rem; line-height: 1.5; }
    .md-preview h2 { font-size: 1.2rem; margin: 0.6rem 0 0.3rem; }
    .md-preview strong { font-weight: 700; }
    .md-preview em { font-style: italic; }
    @media (max-width: 700px) { .md-wrap { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="loading-view" class="admin-gate"><p>Loading…</p></div>
  <div id="login-view" class="admin-gate hidden">
    <div class="admin-login-stack">
      <img class="admin-login-logo" src="images/admin-logo.png" alt="">
      <h1 class="admin-login-title">Admin</h1>
      <form id="login-form" class="admin-login-card">
        <button type="button" id="google-btn" class="oauth-btn">Continue with Google</button>
        <div style="text-align:center; color:var(--text-muted); margin:0.75rem 0; font-size:0.85rem;">or</div>
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button class="btn" type="submit" id="login-btn" style="width:100%;border-radius:999px;">Sign in</button>
        <div id="login-msg" class="error"></div>
      </form>
    </div>
  </div>

  <div id="dashboard" class="admin-wrap hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem;">
      <h1 style="font-size:1.5rem;">Casual_DAViD Admin</h1>
      <div>
        <a href="index.html" class="btn btn-plain" style="text-decoration:none; display:inline-block;">View site</a>
        <button class="btn btn-danger" id="logout-btn">Logout</button>
      </div>
    </div>

    <div class="tabs">
      <button data-tab="mods" class="active">Mods</button>
      <button data-tab="socials">Social Links</button>
    </div>

    <div id="tab-mods">
      <div class="card">
        <h2 id="form-title">Add Mod</h2>
        <input type="hidden" id="edit-id">
        <label>Name *</label>
        <input type="text" id="mod-name" maxlength="120">
        <label>Summary *</label>
        <textarea id="mod-summary" maxlength="256" style="min-height:70px;"></textarea>
        <label>Description (Markdown)</label>
        <div class="md-wrap">
          <div class="md-pane">
            <div class="md-toolbar">
              <button type="button" data-md="**" data-md2="**" title="Bold">B</button>
              <button type="button" data-md="*" data-md2="*" title="Italic">I</button>
              <button type="button" data-md="## " title="Heading">H</button>
              <button type="button" data-md="- " title="List">•</button>
            </div>
            <textarea id="mod-desc" placeholder="Write a description in Markdown…"></textarea>
          </div>
          <div class="md-pane">
            <div class="md-toolbar" style="justify-content:space-between;"><span style="font-size:0.78rem; color:#64748b; padding:0 0.5rem;">PREVIEW</span></div>
            <div class="md-preview" id="md-preview"><span style="color:#94a3b8;">Preview will appear here</span></div>
          </div>
        </div>
        <label>Appreciation / Thank you message (shown after purchase)</label>
        <textarea id="mod-thankyou" placeholder="Thank you for supporting the mod! Click the download button to get your file." style="min-height:80px;"></textarea>
        <label>Donate URL (optional, shown under gallery)</label>
        <input type="url" id="mod-donate" placeholder="https://ko-fi.com/yourname">
        <label>Price (USD) *</label>
        <input type="number" id="mod-price" step="0.01" min="0">
        <label>Type *</label>
        <select id="mod-type">
          <option value="mod">Mod</option>
          <option value="plugin">Plugin</option>
        </select>
        <label>Subcategories (select any)</label>
        <div id="mod-subcategory" class="sub-grid"></div>
        <label>Environment</label>
        <select id="mod-environment">
          <option value="client">Client</option>
          <option value="server">Server</option>
          <option value="both">Client and Server</option>
        </select>
        <label>Logo (optional)</label>
        <input type="file" id="mod-icon" accept="image/*">
        <label>Mod file (optional, .jar / .zip)</label>
        <input type="file" id="mod-file" accept=".jar,.zip,.mrpack,.7z,.rar">
        <div style="margin-top:1rem;">
          <button class="btn" id="save-mod-btn">Save Mod</button>
          <button class="btn btn-plain hidden" id="cancel-edit-btn">Cancel</button>
        </div>
        <div id="mod-msg"></div>
      </div>

      <div class="card">
        <h2>Projects</h2>
        <div id="admin-mod-list" class="mod-list"></div>
      </div>
    </div>

    <div id="tab-socials" class="hidden">
      <div class="card">
        <h2>Social Links</h2>
        <label>YouTube URL</label><input type="url" id="yt-url">
        <label>TikTok URL</label><input type="url" id="tt-url">
        <label>Discord Invite</label><input type="url" id="dc-url">
        <label>Modrinth</label><input type="url" id="mr-url">
        <label>CurseForge</label><input type="url" id="cf-url">
        <label>Personal Discord</label><input type="url" id="pd-url">
        <label>Email</label><input type="email" id="em-url">
        <label>Donate URL</label><input type="url" id="dn-url">
        <button class="btn" id="save-socials-btn">Save Socials</button>
        <div id="social-msg" class="success"></div>
      </div>
    </div>
  </div>

  <script type="module" src="firebase-auth.js"></script>
  <script type="module" src="admin-simple-firebase.js"></script>
  <script src="theme.js"></script>
</body>
</html>
