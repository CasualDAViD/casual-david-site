<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=localStorage.getItem("cd_theme")||"system";if(t==="system")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin • Casual_DAViD</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    .admin-wrap { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: white; border-radius: 16px; border: 1px solid #e2e8f0; padding: 1.5rem; margin-bottom: 1.25rem; box-shadow: 0 4px 20px rgb(0 0 0 / 0.04); }
    .card h2 { margin-bottom: 1rem; font-size: 1.35rem; }
    .login-box { max-width: 420px; margin: 6rem auto; }
    .error { color: #dc2626; font-size: 0.9rem; margin-top: 0.5rem; }
    .success { color: #16a34a; font-size: 0.9rem; margin-top: 0.5rem; }
    .muted { color: #64748b; font-size: 0.85rem; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .hidden { display: none; }
    .admin-gate {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(1.25rem, env(safe-area-inset-top)) 1rem max(1.25rem, env(safe-area-inset-bottom));
      overflow: auto;
      background: var(--bg);
      color: var(--text);
    }
    .admin-gate.hidden { display: none; }
    .admin-gate-loading { color: var(--text-muted); font-size: 0.95rem; }
    .admin-login-stack {
      width: min(100%, 400px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .admin-login-logo {
      width: 88px;
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 16px rgb(15 23 42 / 0.16));
    }
    .admin-login-title {
      margin: 0.7rem 0 1.1rem;
      color: var(--text);
      font-family: var(--heading);
      font-size: 1.8rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .admin-login-card {
      width: 100%;
      margin: 0;
      padding: 2rem 2rem 1.6rem;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 20px;
      box-shadow: 0 12px 40px rgb(0 0 0 / 0.1);
    }
    [data-theme="dark"] .admin-login-card {
      background: rgba(30,41,59,0.9);
      border-color: rgba(255,255,255,0.1);
    }
    .admin-login-card input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      margin-bottom: 0.75rem;
      background: white;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      box-shadow: none;
    }
    [data-theme="dark"] .admin-login-card input {
      background: #0f172a;
      color: white;
      border-color: #334155;
    }
    .admin-login-card input:focus { outline: none; border-color: #3b82f6; }
    .admin-login-card .pw-field { margin-bottom: 0.75rem; }
    .admin-login-card .pw-field input { margin-bottom: 0; padding-right: 2.75rem; }
    .admin-login-card .btn {
      width: 100%;
      justify-content: center;
      margin-top: 0.5rem;
      border: none;
      border-radius: 999px;
      background: var(--primary);
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 14px rgb(37 99 235 / 0.3);
    }
    .admin-login-card .btn:hover { background: #1d4ed8; }
    .admin-login-card .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    #login-msg { min-height: 1.2em; margin-top: 0.65rem; text-align: center; font-size: 0.9rem; }
    .oauth-btn { display: flex; align-items: center; justify-content: center; gap: 0.75rem; width: 100%; padding: 0.75rem 1rem; border-radius: 12px; border: 1px solid var(--border); background: white; cursor: pointer; font-weight: 500; margin-bottom: 0.75rem; }
    [data-theme="dark"] .oauth-btn { background: #1e293b; }
  </style>
</head>
<body>
  <div id="loading-view" class="admin-gate"><p class="admin-gate-loading">Loading…</p></div>

  <div id="login-view" class="admin-gate hidden">
    <div class="admin-login-stack">
      <img class="admin-login-logo" src="images/admin-logo.png" alt="" width="420" height="390">
      <h1 class="admin-login-title">Admin</h1>
      <form id="login-form" class="admin-login-card">
        <button type="button" id="google-btn" class="oauth-btn">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>
        <div style="text-align:center; color:var(--text-muted); margin:0.75rem 0; font-size:0.85rem;">or</div>
        <label class="sr-only" for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="Email" autocomplete="username" required>
        <label class="sr-only" for="login-password">Password</label>
        <div class="pw-field">
          <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false">
            <svg class="pw-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
            <svg class="pw-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/><path d="M5 19L19 5"/></svg>
          </button>
        </div>
        <button class="btn btn-primary" type="submit" id="login-btn">Sign in</button>
        <div id="login-msg" class="error" role="alert"></div>
      </form>
    </div>
  </div>

  <div id="dashboard" class="admin-wrap hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; gap:0.5rem; flex-wrap:wrap;">
      <h1 style="font-size:1.5rem;">Casual_DAViD Admin</h1>
      <div>
        <a href="index.html" class="btn btn-plain" style="text-decoration:none; display:inline-block;">View site</a>
        <button class="btn btn-danger" id="logout-btn">Logout</button>
      </div>
    </div>
    <div class="card">
      <h2>Admin Dashboard</h2>
      <p class="muted">You are signed in as admin.</p>
      <p style="margin-top:1rem;">Full mod management, file uploads, and order tools require the Node backend. On free Firebase Hosting only the login gate is active.</p>
    </div>
  </div>

  <script type="module" src="firebase-auth.js"></script>
  <script type="module">
    import { signInWithEmailAndPassword, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    const ADMIN_EMAILS = ['okpeidavid7@gmail.com']; // add more if needed

    function showView(id) {
      ['loading-view', 'login-view', 'dashboard'].forEach((v) => document.getElementById(v).classList.toggle('hidden', v !== id));
    }

    function setMsg(text) {
      document.getElementById('login-msg').textContent = text || '';
    }

    function isAdmin(user) {
      return user && ADMIN_EMAILS.includes((user.email || '').toLowerCase());
    }

    function checkUser(user) {
      if (isAdmin(user)) {
        showView('dashboard');
      } else {
        if (user) setMsg('This account is not an admin.');
        showView('login-view');
      }
    }

    window.firebaseAuth.onAuthStateChanged(window.firebaseAuth.auth, checkUser);

    document.getElementById('google-btn').addEventListener('click', async () => {
      try {
        await signInWithPopup(window.firebaseAuth.auth, window.firebaseAuth.googleProvider);
      } catch (err) {
        setMsg(err.message);
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      setMsg('');
      try {
        await signInWithEmailAndPassword(
          window.firebaseAuth.auth,
          document.getElementById('login-email').value,
          document.getElementById('login-password').value
        );
      } catch (err) {
        setMsg(err.message);
        btn.disabled = false;
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await window.firebaseAuth.signOut(window.firebaseAuth.auth);
      showView('login-view');
    });
  </script>
  <script src="theme.js"></script>
  <script src="password-toggle.js"></script>
</body>
</html>
