<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=localStorage.getItem("cd_theme")||"system";if(t==="system")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in • Casual_DAViD</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .login-card { background: rgba(255,255,255,0.92); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.6); border-radius: 20px; padding: 2.5rem; max-width: 400px; width: 100%; box-shadow: 0 12px 40px rgb(0 0 0 / 0.1); }
    [data-theme="dark"] .login-card { background: rgba(30,41,59,0.9); border-color: rgba(255,255,255,0.1); }
    .login-card h1 { font-family: var(--heading); font-size: 1.8rem; margin-bottom: 0.5rem; }
    .login-card p.sub { color: var(--text-muted); margin-bottom: 1.5rem; }
    .oauth-btn { display: flex; align-items: center; gap: 0.75rem; width: 100%; padding: 0.75rem 1rem; border-radius: 12px; border: 1px solid var(--border); background: white; cursor: pointer; font-weight: 500; margin-bottom: 0.75rem; text-decoration: none; color: var(--text); box-sizing: border-box; }
    [data-theme="dark"] .oauth-btn { background: #1e293b; }
    .oauth-btn:hover { background: #f8fafc; }
    [data-theme="dark"] .oauth-btn:hover { background: #334155; }
    .divider { text-align: center; color: var(--text-muted); margin: 1.25rem 0; font-size: 0.85rem; }
    .login-card input { width: 100%; padding: 0.75rem 1rem; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 0.75rem; background: white; font-size: 0.95rem; box-sizing: border-box; }
    [data-theme="dark"] .login-card input { background: #0f172a; color: white; border-color: #334155; }
    .login-card input:focus { outline: none; border-color: #3b82f6; }
    .login-card .btn { width: 100%; justify-content: center; margin-top: 0.5rem; }
    .login-card .pw-field { margin-bottom: 0.75rem; }
    .login-card .pw-field input { margin-bottom: 0; padding-right: 2.75rem; }
    .create-link { display: block; text-align: center; margin-top: 1.25rem; color: var(--primary); text-decoration: none; font-size: 0.9rem; }
    .form-msg { font-size: 0.9rem; margin: 0.25rem 0 0.5rem; min-height: 1.2em; }
    .form-msg.error { color: #dc2626; }
    .form-msg.ok { color: #16a34a; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Sign in</h1>
      <p class="sub">Use your account to continue</p>

      <button id="google-btn" class="oauth-btn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>
      <div class="divider">or</div>

      <form id="form">
        <input type="email" id="email" placeholder="Email" autocomplete="email" required>
        <div class="pw-field">
          <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle is-hidden" aria-label="Show password" aria-pressed="false">
            <svg class="pw-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="pw-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <div id="msg" class="form-msg" role="alert"></div>
        <button type="submit" id="submit" class="btn btn-primary">Sign in</button>
      </form>
      <a href="signup.html" class="create-link">New? Create account</a>
    </div>
  </div>
  <script type="module" src="firebase-auth.js"></script>
  <script>
    function setMsg(text, ok) {
      const el = document.getElementById('msg');
      el.textContent = text || '';
      el.className = 'form-msg ' + (ok ? 'ok' : 'error');
    }

    const next = new URLSearchParams(location.search).get('next') || 'index.html';

    function waitForFirebase(maxWait = 5000) {
      return new Promise((resolve) => {
        const start = Date.now();
        const check = () => {
          if (window.firebaseAuth && window.firebaseAuth.auth) {
            resolve(window.firebaseAuth);
            return;
          }
          if (Date.now() - start > maxWait) {
            resolve(null);
            return;
          }
          setTimeout(check, 100);
        };
        check();
      });
    }

    document.getElementById('google-btn').addEventListener('click', async () => {
      const btn = document.getElementById('google-btn');
      btn.disabled = true;
      setMsg('Opening Google…', true);

      const fb = await waitForFirebase();
      if (!fb) {
        setMsg('Auth is still loading. Try again in a moment.');
        btn.disabled = false;
        return;
      }

      try {
        const result = await fb.signInWithPopup(fb.auth, fb.googleProvider);
        if (result && result.user) {
          setMsg('Signed in. Redirecting…', true);
          setTimeout(() => { location.href = next; }, 400);
        } else {
          setMsg('Sign-in completed but no user returned. Try again.');
          btn.disabled = false;
        }
      } catch (err) {
        console.error('Google sign-in error:', err);
        const code = err.code || '';
        let msg = err.message || 'Google sign-in failed';
        if (code === 'auth/popup-closed-by-user') msg = 'Sign-in cancelled.';
        if (code === 'auth/popup-blocked') msg = 'Popup was blocked. Allow popups and try again.';
        if (code === 'auth/unauthorized-domain') msg = 'This domain is not authorized for sign-in. Check Firebase Auth settings.';
        setMsg(msg);
        btn.disabled = false;
      }
    });

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit');
      btn.disabled = true;
      setMsg('');
      const fb = await waitForFirebase();
      if (!fb) { setMsg('Auth is still loading. Try again.'); btn.disabled = false; return; }
      try {
        await fb.signInWithEmailAndPassword(
          fb.auth,
          document.getElementById('email').value,
          document.getElementById('password').value
        );
        location.href = next;
      } catch (err) {
        setMsg(err.message || 'Sign-in failed');
        btn.disabled = false;
      }
    });
  </script>
  <script src="theme.js"></script>
  <script src="password-toggle.js"></script>
<script src="page-transition.js"></script>
</body>
</html>
