<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=localStorage.getItem("cd_theme")||"system";if(t==="system")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchase History • Casual_DAViD</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    .order-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; padding: 1rem 1.25rem; margin-bottom: 1rem;
      background: rgba(255,255,255,0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.8); border-radius: 16px; box-shadow: var(--shadow); }
    [data-theme="dark"] .order-row { background: rgba(30,41,59,0.7); border-color: rgba(255,255,255,0.1); }
    .order-icon { width: 48px; height: 48px; border-radius: 10px; background: #e0e7ff; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; font-size: 1.4rem; }
    .order-icon img { width: 100%; height: 100%; object-fit: cover; }
    .ref-id { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.78rem; color: #64748b; word-break: break-all; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <header class="header"><div class="header-inner">
      <a href="index.html" class="logo">
        <img src="avatar.png" alt="Casual_DAViD" class="logo-img">
        <div class="logo-text">
          <span class="name">Casual_DAViD</span>
          <span class="tag">Quality of Life Mods & Plugins</span>
        </div>
      </a>
      <nav class="nav-pill">
        <a href="content.html">Socials</a>
        <a href="mods.html">Mods</a>
        <a href="about.html">About</a>
      </nav>
      <button class="hamburger" onclick="toggleMenu()" aria-label="Menu" style="background:none;border:none;cursor:pointer;padding:0.4rem;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="6" width="18" height="2" rx="1"/><rect x="3" y="11" width="18" height="2" rx="1"/><rect x="3" y="16" width="18" height="2" rx="1"/></svg>
  </button>
      <div class="header-right" style="display:flex;align-items:center;gap:0.5rem;">
        <button id="theme-btn" onclick="cycleTheme()" style="background:none;border:1px solid #e2e8f0;border-radius:999px;padding:0.35rem 0.55rem;cursor:pointer;display:flex;align-items:center;"></button>
        <button id="account-btn" style="background:none;border:1px solid #e2e8f0;border-radius:999px;padding:0.35rem 0.7rem;cursor:pointer;font-size:0.85rem;">Sign in</button>
      </div>
    </div>
  </header>
  <div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>
  <div class="mobile-menu" id="mobile-menu">
    <a href="content.html">Socials</a>
    <a href="mods.html">Mods</a>
    <a href="about.html">About</a>
  </div>

  <section class="section">
    <div class="container" style="max-width:720px;">
      <h1 style="margin-bottom:1.5rem;">Purchase history</h1>
      <div id="orders"><p style="color:var(--text-muted);">Loading…</p></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer-inner">
      <p>© 2026 Casual_DAViD </p>
      <p>NOT AFFILIATED WITH MOJANG OR MICROSOFT</p>
    </div>
  </footer>

  <script type="module" src="firebase-auth.js"></script>
  <script type="module" src="firebase-mods.js"></script>
  <script type="module">
    import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const box = document.getElementById('orders');

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({
        '&': '&', '<': '<', '>': '>', '"': '"', "'": '&#39;'
      }[c]));
    }

    function getUser() {
      return new Promise((resolve) => {
        let tries = 0;
        const tick = () => {
          if (window.firebaseAuth && window.firebaseAuth.auth) {
            const auth = window.firebaseAuth.auth;
            if (auth.currentUser) { resolve(auth.currentUser); return; }
            const unsub = window.firebaseAuth.onAuthStateChanged(auth, (user) => {
              unsub();
              resolve(user || null);
            });
            return;
          }
          if (tries++ < 30) setTimeout(tick, 100);
          else resolve(null);
        };
        setTimeout(tick, 200);
      });
    }

    async function load() {
      const user = await getUser();
      if (!user) {
        box.innerHTML = '<p>Please <a href="login.html?next=history.html" style="color:#2563eb;">sign in</a> to see your purchases.</p>';
        return;
      }

      try {
        const db = getFirestore();
        const q = query(collection(db, 'purchases'), where('userId', '==', user.uid));
        const snap = await getDocs(q);

        const mine = [];
        snap.forEach(d => mine.push(d.data()));

        if (!mine.length) {
          const q2 = query(collection(db, 'purchases'), where('uid', '==', user.uid));
          const snap2 = await getDocs(q2);
          snap2.forEach(d => mine.push(d.data()));
        }

        if (!mine.length) {
          box.innerHTML = '<p style="color:var(--text-muted);">No purchases yet. When you buy a mod, it will show up here.</p>';
          return;
        }

        let html = '';
        for (const p of mine) {
          let mod = { name: 'Mod', icon: '', fileUrl: '', fileName: 'download' };
          try {
            const ms = await getDoc(doc(db, 'mods', p.modId));
            if (ms.exists()) mod = ms.data();
          } catch (e) {}

          const ts = p.paidAt || p.purchasedAt;
          const date = ts ? new Date(ts).toLocaleDateString() : '';
          const amount = Number(p.amount || 0);
          const ref = p.reference || '';

          html += `
            <div class="order-row">
              <div class="order-icon">${mod.icon ? `<img src="${escapeHtml(mod.icon)}" alt="">` : '<span>📦</span>'}</div>
              <div style="flex:1; min-width:180px;">
                <strong>${escapeHtml(mod.name || 'Mod')}</strong>
                <div style="font-size:0.85rem; color:#64748b;">${date} • $${amount.toFixed(2)}</div>
                ${ref ? `<div class="ref-id">Ref: ${escapeHtml(ref)}</div>` : ''}
              </div>
              ${mod.fileUrl ? `<a class="buy-btn" style="text-decoration:none;" href="${escapeHtml(mod.fileUrl)}" download="${escapeHtml(mod.fileName || 'download')}">Download</a>` : ''}
            </div>
          `;
        }
        box.innerHTML = html;
      } catch (err) {
        console.error(err);
        const msg = (err.message || '').includes('permission')
          ? 'Permission denied. Update your Firestore rules to allow reading purchases.'
          : (err.message || 'Failed to load');
        box.innerHTML = '<p style="color:#dc2626;">' + escapeHtml(msg) + '</p>';
      }
    }

    load();
  </script>
  <script src="theme.js"></script>
  <script src="account.js"></script>
<script src="page-transition.js"></script>
</body>
</html>
