<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=localStorage.getItem("cd_theme")||"system";if(t==="system")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header"><div class="header-inner">
      <a href="index.html" class="logo">
        <img src="avatar.png" alt="Casual_DAViD" class="logo-img">
        <div class="logo-text">
          <span class="name">Casual_DAViD</span>
          <span class="tag">Quality of Life Mods & Plugins</span>
        </div>
      </a>
      <nav class="nav-pill">
        <a href="content.html">Content</a>
        <a href="mods.html">Mods</a>
        <a href="about.html">About</a>
      </nav>
      <button class="hamburger" onclick="toggleMenu()" aria-label="Menu" style="background:none;border:none;cursor:pointer;padding:0.4rem;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="6" width="18" height="2" rx="1"/><rect x="3" y="11" width="18" height="2" rx="1"/><rect x="3" y="16" width="18" height="2" rx="1"/></svg>
  </button>
      <div class="header-right" style="display:flex;align-items:center;gap:0.5rem;">
        <button id="theme-btn" onclick="cycleTheme()" style="background:none;border:1px solid #e2e8f0;border-radius:999px;padding:0.35rem 0.55rem;cursor:pointer;display:flex;align-items:center;"></button>
        <button id="account-btn" style="background:none;border:1px solid #e2e8f0;border-radius:999px;padding:0.35rem 0.7rem;cursor:pointer;font-size:0.85rem;">Sign in</button>
        <a href="mods.html" class="btn-sm">Shop</a>
      </div>
    </div>
  </header>
  <div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>
  <div class="mobile-menu" id="mobile-menu">
    <a href="content.html">Content</a>
    <a href="mods.html">Mods</a>
    <a href="about.html">About</a>
    <a href="mods.html">Shop</a>
  </div>


  <section class="section">
    <div class="container" style="max-width:560px; text-align:center;">
      <h1 id="title" style="margin-bottom:1rem;">Checking your payment&hellip;</h1>
      <p id="text" style="color:var(--text-muted);">One moment while we confirm it with Paystack.</p>
      <p id="actions" style="margin-top:1.5rem;"></p>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer-inner">
      <p>© 2026 Casual_DAViD </p>
      <p>NOT AFFILIATED WITH MOJANG OR MICROSOFT</p>
    </div>
  </footer>
  <script src="api.js"></script>
  <script>
    (async function () {
      const title = document.getElementById('title');
      const text = document.getElementById('text');
      const actions = document.getElementById('actions');
      const p = new URLSearchParams(location.search);
      const reference = p.get('reference') || p.get('trxref') || '';

      function done(heading, body, html) {
        title.textContent = heading;
        text.textContent = body;
        actions.innerHTML = html || '';
      }

      const user = await getMe();
      if (!user) { location.replace('login.html?next=' + encodeURIComponent(location.pathname + location.search)); return; }
      if (!reference) { done('Nothing to check', 'This page needs a payment reference.', '<a class="buy-btn" style="text-decoration:none;display:inline-block;" href="mods.html">Back to mods</a>'); return; }

      // Paystack may take a few seconds to confirm, so ask a few times.
      for (let attempt = 0; attempt < 6; attempt++) {
        let r;
        try {
          r = await api('/api/orders/verify?reference=' + encodeURIComponent(reference));
        } catch (err) {
          done('We could not check that payment', err.message, '<a class="buy-btn" style="text-decoration:none;display:inline-block;" href="history.html">Purchase history</a>');
          return;
        }
        if (r.status === 'paid') {
          done('Payment received \u{1F389}', 'Thanks! ' + r.modName + ' is ready to download.',
            '<a class="buy-btn" style="text-decoration:none;display:inline-block;" href="/api/downloads/' + encodeURIComponent(r.modId) + '">Download now</a> ' +
            '<a style="margin-left:1rem;" href="history.html">Purchase history</a>');
          return;
        }
        if (r.status === 'failed') {
          done('Payment did not go through', 'You have not been charged for ' + r.modName + '. You can try again any time.',
            '<a class="buy-btn" style="text-decoration:none;display:inline-block;" href="checkout.html?id=' + encodeURIComponent(r.modId) + '">Try again</a>');
          return;
        }
        await new Promise(res => setTimeout(res, 3000));
      }
      done('Still waiting for confirmation', 'If you completed the payment, it can take a minute to show up. Your purchase and receipt will appear in your purchase history.',
        '<a class="buy-btn" style="text-decoration:none;display:inline-block;" href="history.html">Check purchase history</a>');
    })();
  </script>
  <script src="theme.js"></script>
  <script src="account.js"></script>
</body>
</html>
