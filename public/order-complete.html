<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdn.jsdelivr.net https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.gstatic.com https://apis.google.com https://accounts.google.com https://*.workers.dev https://api.paystack.co; frame-src 'self' https://accounts.google.com https://*.google.com https://*.firebaseapp.com https://*.web.app https://checkout.paystack.com https://*.paystack.com; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.paystack.com https://*.paystack.com">
<script>(function(){var t=localStorage.getItem("cd_theme")||"system";if(t==="system")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order complete • Casual_DAViD</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    .complete-wrap { max-width: 900px; margin: 3rem auto; padding: 0 1.5rem; }
    .complete-layout { display: grid; grid-template-columns: 1fr 1.2fr; gap: 2rem; align-items: center; }
    .download-side { text-align: center; }
    .info-side { background: rgba(255,255,255,0.8); backdrop-filter: blur(16px); border-radius: 20px; padding: 2rem; border: 1px solid rgba(255,255,255,0.6); }
    [data-theme="dark"] .info-side { background: rgba(30,41,59,0.9); border-color: rgba(255,255,255,0.1); color: #e2e8f0; }
    .mod-icon { width: 80px; height: 80px; border-radius: 16px; object-fit: cover; background: #f1f5f9; margin-bottom: 1rem; }
    .check { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .btn { display: inline-block; background: #2563eb; color: white; padding: 0.9rem 2rem; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 1.05rem; border: none; cursor: pointer; }
    .btn:hover { background: #1d4ed8; }
    .appreciation { margin-top: 1rem; line-height: 1.6; color: #475569; }
    [data-theme="dark"] .appreciation { color: #cbd5e1; }
    .ref-id { margin-top: 1rem; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.8rem; color: #64748b; word-break: break-all; }
    @media (max-width: 700px) { .complete-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="header"><div class="header-inner">
      <a href="index.html" class="logo">
        <img src="avatar.png" alt="Casual_DAViD" class="logo-img">
        <div class="logo-text">
          <span class="name">Casual_DAViD</span>
          <span class="tag">Quality of Life Mods & Plugins</span>
        </div>
      </a>
      <nav class="nav-pill">
        <a href="content.html">Socials</a>
        <a href="mods.html">Mods</a>
        <a href="about.html">About</a>
      </nav>
      <button id="theme-btn" onclick="cycleTheme()" style="background:none;border:1px solid #e2e8f0;border-radius:999px;padding:0.35rem 0.55rem;cursor:pointer;"></button>
      <button id="account-btn" onclick="openLogin()" style="background:none;border:1px solid #e2e8f0;border-radius:999px;padding:0.35rem 0.7rem;cursor:pointer;font-size:0.85rem;">Sign in</button>
    </div>
  </header>

  <div class="complete-wrap">
    <div id="result">
      <p style="text-align:center;">Verifying payment…</p>
    </div>
  </div>

  <script src="api.js"></script>
  <script type="module" src="firebase-auth.js"></script>
  <script type="module" src="firebase-mods.js"></script>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const reference = params.get('reference') || params.get('trxref') || '';

    async function waitForAuth(maxWait = 5000) {
      return new Promise((resolve) => {
        const start = Date.now();
        const check = () => {
          if (window.firebaseAuth && window.firebaseAuth.auth && window.firebaseAuth.onAuthStateChanged) {
            const unsub = window.firebaseAuth.onAuthStateChanged(window.firebaseAuth.auth, (user) => {
              if (user || Date.now() - start > maxWait) {
                unsub();
                resolve(user || null);
              }
            });
            return;
          }
          if (Date.now() - start > maxWait) { resolve(null); return; }
          setTimeout(check, 150);
        };
        check();
      });
    }

    async function verify() {
      const box = document.getElementById('result');
      if (!/^[A-Za-z0-9_-]{6,80}$/.test(reference)) {
        box.textContent = 'No payment reference found.';
        return;
      }

      try {
        const user = await waitForAuth();
        const headers = {};
        if (user) headers.Authorization = 'Bearer ' + await user.getIdToken();
        const res = await fetch(CD_PAYSTACK_URL + 'verify?reference=' + encodeURIComponent(reference), { headers });
        const data = await res.json();

        if (!data.success) {
          box.textContent = 'Payment was not successful. Please try again or contact support.';
          return;
        }

        const modId = data.modId || (data.metadata && data.metadata.modId);
        let mod = null;
        if (modId && window.firebaseMods) mod = await window.firebaseMods.get(modId);
        const seal = fileSealOf(mod);
        const fileUrl = fileUrlOf(mod);
        const fileName = fileNameOf(mod);
        const thankYou = (mod && mod.thankYou) || 'Thank you for your purchase. Your download is below.';
        const name = (mod && mod.name) || data.modName || 'Your mod';
        const icon = mod && safeUrl(mod.icon);
        const pending = data.recorded === false
          ? '<p>Payment confirmed. If the download is not ready yet, check purchase history shortly or email support.</p>'
          : '';

        box.innerHTML = `
          <div class="complete-layout">
            <div class="download-side">
              <div class="check">✅</div>
              <h2>Payment successful</h2>
              ${seal ? '<button class="btn" id="download-seal" type="button">Download mod</button>' : (fileUrl ? `<a class="btn" href="${escapeHtml(fileUrl)}" download="${escapeHtml(fileName)}">Download mod</a>` : '<p>File link will be available shortly.</p>')}
              ${pending}
              <div class="ref-id">Reference: ${escapeHtml(reference)}</div>
              <div style="margin-top:1.5rem;"><a href="history.html" style="color:#2563eb;">View purchase history</a></div>
            </div>
            <div class="info-side">
              ${icon ? `<img class="mod-icon" src="${escapeHtml(icon)}" alt="">` : ''}
              <h1>${escapeHtml(name)}</h1>
              <div class="appreciation">${escapeHtml(thankYou)}</div>
            </div>
          </div>
        `;
        const dl = document.getElementById('download-seal');
        if (dl) dl.addEventListener('click', async () => {
          dl.disabled = true;
          try { await downloadOwnedFile(modId, fileName); }
          catch (e) { dl.textContent = 'Try again'; dl.disabled = false; }
        });
      } catch (err) {
        box.textContent = 'Could not verify payment. Please contact support with your reference.';
      }
    }

    verify();
  </script>
  <script src="theme.js"></script>
  <script src="account.js"></script>
</body>
</html>
