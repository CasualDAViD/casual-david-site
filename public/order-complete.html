<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=localStorage.getItem("cd_theme")||"system";if(t==="system")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order complete • Casual_DAViD</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    .complete-wrap { max-width: 900px; margin: 3rem auto; padding: 0 1.5rem; }
    .complete-layout { display: grid; grid-template-columns: 1fr 1.2fr; gap: 2rem; align-items: center; }
    .download-side { text-align: center; }
    .info-side { background: rgba(255,255,255,0.8); backdrop-filter: blur(16px); border-radius: 20px; padding: 2rem; border: 1px solid rgba(255,255,255,0.6); }
    [data-theme="dark"] .info-side { background: rgba(30,41,59,0.9); border-color: rgba(255,255,255,0.1); color: #e2e8f0; }
    .mod-icon { width: 80px; height: 80px; border-radius: 16px; object-fit: cover; background: #f1f5f9; margin-bottom: 1rem; }
    .check { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .btn { display: inline-block; background: #2563eb; color: white; padding: 0.9rem 2rem; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 1.05rem; }
    .btn:hover { background: #1d4ed8; }
    .appreciation { margin-top: 1rem; line-height: 1.6; color: #475569; }
    [data-theme="dark"] .appreciation { color: #cbd5e1; }
    @media (max-width: 700px) { .complete-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="header"><div class="header-inner">
      <a href="index.html" class="logo">
        <img src="avatar.png" alt="Casual_DAViD" class="logo-img">
        <div class="logo-text">
          <span class="name">Casual_DAViD</span>
          <span class="tag">Quality of Life Mods & Plugins</span>
        </div>
      </a>
      <nav class="nav-pill">
        <a href="content.html">Socials</a>
        <a href="mods.html">Mods</a>
        <a href="about.html">About</a>
      </nav>
      <button id="theme-btn" onclick="cycleTheme()" style="background:none;border:1px solid #e2e8f0;border-radius:999px;padding:0.35rem 0.55rem;cursor:pointer;"></button>
      <button id="account-btn" onclick="openLogin()" style="background:none;border:1px solid #e2e8f0;border-radius:999px;padding:0.35rem 0.7rem;cursor:pointer;font-size:0.85rem;">Sign in</button>
    </div>
  </header>

  <div class="complete-wrap">
    <div id="result">
      <p style="text-align:center;">Verifying payment…</p>
    </div>
  </div>

  <script type="module" src="firebase-auth.js"></script>
  <script type="module" src="firebase-mods.js"></script>
  <script type="module">
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const PAYSTACK_WORKER = 'https://casualdavid-paystack.okpeidavid7.workers.dev/';
    const params = new URLSearchParams(location.search);
    const reference = params.get('reference') || params.get('trxref');

    // Set this to false when you switch to live Paystack keys
    const TEST_MODE = true;

    async function waitForAuth(maxWait = 5000) {
      return new Promise((resolve) => {
        const start = Date.now();
        const check = () => {
          if (window.firebaseAuth && window.firebaseAuth.auth && window.firebaseAuth.onAuthStateChanged) {
            setTimeout(() => {
              const unsub = window.firebaseAuth.onAuthStateChanged(window.firebaseAuth.auth, (user) => {
                if (user) {
                  unsub();
                  resolve(user);
                  return;
                }
                if (Date.now() - start > maxWait) {
                  unsub();
                  resolve(null);
                }
              });
            }, 200);
            return;
          }
          if (Date.now() - start > maxWait) { resolve(null); return; }
          setTimeout(check, 150);
        };
        check();
      });
    }

    async function verify() {
      const box = document.getElementById('result');
      if (!reference) {
        box.innerHTML = '<p>No payment reference found.</p>';
        return;
      }

      try {
        const res = await fetch(PAYSTACK_WORKER + 'verify?reference=' + encodeURIComponent(reference));
        const data = await res.json();

        if (!data.success) {
          box.innerHTML = '<p>Payment was not successful. Please try again or contact support.</p>';
          return;
        }

        const modId = data.metadata?.modId;
        let mod = null;
        if (modId && window.firebaseMods) {
          mod = await window.firebaseMods.get(modId);
        }

        const fileUrl = mod?.fileUrl || (mod?.versions?.[0]?.fileUrl);
        const fileName = mod?.fileName || (mod?.versions?.[0]?.fileName) || 'download';
        const thankYou = mod?.thankYou || 'Thank you for your purchase! Click the download button to get your mod.';

        const versions = mod?.versions || [];
        const amount = versions.length ? Number(versions[0].price) : Number(mod?.price || 0);

        // Record purchase if user is signed in
        const user = await waitForAuth();
        if (user && modId) {
          try {
            const db = getFirestore();
            await setDoc(doc(db, 'purchases', user.uid + '_' + modId), {
              uid: user.uid,
              userId: user.uid,
              modId,
              reference,
              amount,
              test: TEST_MODE,
              paidAt: Date.now(),
              purchasedAt: Date.now()
            });
          } catch (e) { console.warn('Could not save purchase', e); }
        }

        box.innerHTML = `
          <div class="complete-layout">
            <div class="download-side">
              <div class="check">✅</div>
              <h2>Payment successful</h2>
              ${fileUrl ? `<a class="btn" href="${fileUrl}" download="${fileName}">Download mod</a>` : '<p>File link will be available shortly.</p>'}
              <div style="margin-top:1.5rem;"><a href="history.html" style="color:#2563eb;">View purchase history</a></div>
            </div>
            <div class="info-side">
              ${mod?.icon ? `<img class="mod-icon" src="${mod.icon}" alt="">` : ''}
              <h1>${mod?.name || 'Your mod'}</h1>
              <div class="appreciation">${thankYou}</div>
            </div>
          </div>
        `;
      } catch (err) {
        box.innerHTML = '<p>Could not verify payment. Please contact support with your reference.</p>';
      }
    }

    verify();
  </script>
  <script src="theme.js"></script>
  <script src="account.js"></script>
</body>
</html>
